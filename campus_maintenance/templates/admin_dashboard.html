{% extends 'base.html' %}


{% block content %}


<h2>
Staff Dashboard
</h2>


{% for r in requests %}


<p>

{{r.title}}

-

{{r.status}}

</p>


<form method="post">

{% csrf_token %}


<input type="hidden"
name="id"
value="{{r.id}}">


<select name="status">

<option>
Pending
</option>


<option>
In Progress
</option>


<option>
Completed
</option>


</select>


<button>
Update
</button>


</form>


<hr>


{% endfor %}


{% endblock %}
